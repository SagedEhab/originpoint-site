<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import { build } from './scene.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080, act = +q.get('act') || 4;
const e = build({ width: W, height: H, canvas: document.getElementById('c'), shadowSize: +q.get('shadow') || 4096 });
const cams = {
  master:  { pos: [18.0, 13.4, 23.2], look: [0.2, 0.2, 0.4], fov: 26, offsetX: -0.09, offsetY: 0.0 },
  origin:  { pos: [3.2, 3.4, 7.4], look: [0, 0.2, 0], fov: 32 },
  top:     { pos: [0.01, 36, 0.02], look: [0, 0, 0.3], fov: 24 },
  dolly:   { pos: [6.5, 5.2, 12.5], look: [0, 0.2, 0.3], fov: 28 },
  studio:  { pos: [-13.5, 6.4, 8.2], look: [-8, 1.6, -1.6], fov: 30 }
};
e.setAct(act);
if (q.get('hide') === 'zones') e.showBuildings(false);
e.frame(cams[q.get('cam') || 'master']);
e.render();
document.body.dataset.ready = '1';
</script></body></html>
